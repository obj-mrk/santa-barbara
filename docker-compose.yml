version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: snt-postgres
    restart: always
    environment:
      POSTGRES_DB: sntdb
      POSTGRES_USER: sntuser
      POSTGRES_PASSWORD: sntpass
    ports:
      - "5434:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data